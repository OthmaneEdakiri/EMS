<h2 class="sr-only">Class diagram dyal ERP SaaS MVP: Tenant, User, Customer, Product, Invoice, InvoiceLine, Payment o l3alaqat bynathom</h2>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
  },
});
const def = `classDiagram
  class Tenant {
    +id
    +name
    +currency
    +invoice_prefix
    +locale
  }
  class User {
    +id
    +tenant_id
    +name
    +email
    +role
    +must_change_password
  }
  class Customer {
    +id
    +tenant_id
    +name
    +tax_id
    +email
    +archived_at
  }
  class Product {
    +id
    +tenant_id
    +type
    +name
    +unit_price
    +archived_at
  }
  class Invoice {
    +id
    +tenant_id
    +customer_id
    +number
    +status
    +subtotal
    +tax_total
    +total
  }
  class InvoiceLine {
    +id
    +invoice_id
    +product_id
    +qty
    +unit_price
    +line_total
  }
  class Payment {
    +id
    +tenant_id
    +invoice_id
    +amount
    +method
    +paid_at
  }
  Tenant "1" --> "many" User
  Tenant "1" --> "many" Customer
  Tenant "1" --> "many" Product
  Tenant "1" --> "many" Invoice
  Customer "1" --> "many" Invoice
  Invoice "1" --> "many" InvoiceLine
  Product "1" --> "many" InvoiceLine
  Invoice "1" --> "many" Payment`;
const { svg } = await mermaid.render('cd-svg', def);
document.getElementById('cd').innerHTML = svg;
document.querySelectorAll('#cd svg .node rect, #cd svg .node path').forEach(el => {
  el.setAttribute('rx', '8');
});
</script>
